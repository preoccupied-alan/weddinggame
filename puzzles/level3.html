<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<!-- there is no answer box here — the puzzle is the address bar -->
<title>III · The Sweet One</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/shared.css">
<style>
.morse { font-family:'Courier Prime',monospace; font-size:20px; color:var(--ink); letter-spacing:0.2em; text-align:center; line-height:2.4; }
.morse-key { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; font-family:'Courier Prime',monospace; font-size:9px; color:var(--ink3); }
.morse-key span { text-align:center; }
.play-btn {
  font-family:var(--sans); font-size:13px; font-weight:400;
  color:var(--accent); background:var(--accent3);
  border:1px solid var(--accent4); padding:9px 20px;
  border-radius:6px; cursor:pointer; letter-spacing:0.04em;
  -webkit-tap-highlight-color:transparent; transition:background 0.15s;
}
.play-btn:active { background:var(--accent4); }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">N0T WEDDING</span>
  <div class="meta">Alan &amp; Lisa · III of VII</div>
</div>
<main>
  <div class="lvl-num">III</div>
  <div class="lvl-title">The Sweet One</div>
  <div class="rule"></div>

  <div class="clue" style="flex-direction:column;gap:18px;">
    <div class="morse">
      −·−·<br>
      −−−<br>
      −·−·<br>
      −−−
    </div>
    <button class="play-btn" id="play-btn">▶ Play audio</button>
  </div>

  <div class="morse-key">
    <span>A ·−</span><span>B −···</span><span>C −·−·</span><span>D −··</span>
    <span>E ·</span><span>F ··−·</span><span>G −−·</span><span>H ····</span>
    <span>I ··</span><span>J ·−−−</span><span>K −·−</span><span>L ·−··</span>
    <span>M −−</span><span>N −·</span><span>O −−−</span><span>P ·−−·</span>
    <span>Q −−·−</span><span>R ·−·</span><span>S ···</span><span>T −</span>
    <span>U ··−</span><span>V ···−</span><span>W ·−−</span><span>X −··−</span>
    <span>Y −·−−</span><span>Z −−··</span>
  </div>

  <div class="prose">
    He is small. He would like to be in your lap, please. All the time
  </div>

  
  </div>
</main>
<script src="../assets/shared.js"></script>
<script>
document.getElementById('play-btn').addEventListener('click', () => {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const D=0.09, SH=0.27, IG=0.07, LG=0.24;
  const letters = [[[3,1,3,1]],[[3,3,3]],[[3,1,3,1]],[[3,3,3]]];
  let t = ctx.currentTime + 0.1;
  letters.forEach(u => {
    u[0].forEach(v => {
      const dur = v===1?D:SH;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=520;o.type='sine';
      g.gain.setValueAtTime(0.25,t);g.gain.setValueAtTime(0,t+dur-0.01);
      o.start(t);o.stop(t+dur);t+=dur+IG;
    });
    t+=LG;
  });
});
</script>
<div class="ref-box"></div><div class="input-row">
  <input class="puz-input" type="text" placeholder="who is this?" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="none">
  <button class="submit">→</button>
</div>
<div class="fb"></div>
<div class="attempts">attempts: 0</div>
</main>
<script src="../assets/shared.js"></script>
<script>
setupPuzzle({
answer: 'coco',
hint: 'Listening is helpful but not strictly necessary',
onSuccess: () => { window.location.href = 'level4.html'; }
});
</script>
</div>
</body>
</html>
