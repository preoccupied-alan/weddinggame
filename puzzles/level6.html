<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VI · The Other Half</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/shared.css">
<style>
.mirrored {
  font-family: var(--serif); font-size: 36px; color: var(--ink);
  letter-spacing: 0.08em; display: inline-block;
  transform: scaleX(-1); font-style: italic;
}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">One Hundred and One</span>
  <div class="meta">Alan &amp; Lisa · VI of VII</div>
</div>
<main>
  <div class="lvl-num">VI</div>
  <div class="lvl-title">The Other One</div>
  <div class="rule"></div>

  <div class="clue" style="flex-direction:column;gap:6px;">
    <div style="font-family:'Courier Prime',monospace;font-size:11px;color:var(--ink3);background:var(--bg2);border:1px solid var(--rule);border-radius:6px;padding:10px 14px;word-break:break-all;line-height:1.7;width:100%;">
      level6.html<span style="color:var(--accent);">?name=</span><span style="color:var(--ink);" id="name-val">???</span>
    </div>
  </div>

  <div class="clue" style="text-align:center;flex-direction:column;gap:8px;">
    <div class="mirrored">UV</div>
    <div style="font-family:var(--sans);font-size:11px;font-weight:300;color:var(--ink3);"></div>
  </div>

  <div id="locked-state">
    <div class="prose">
      What is Alan's middle name?
    </div>
    <div style="font-family:var(--sans);font-size:12px;color:var(--err);margin-top:16px;font-weight:400;">
      name missing or incorrect
    </div>
  </div>

  <div id="unlocked-state" style="display:none;flex-direction:column;gap:16px;">
    <span class="chip-ok" style="align-self:flex-start;">✓ name accepted</span>
    <div class="prose">Honestly, I'm not sure how many people knew that one. Find a groomsman and take a selfie and send it to Alan to go to the next one</div>

</main>
<script src="../assets/shared.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const name = (params.get('name') || '').toLowerCase().trim();
document.getElementById('name-val').textContent = name || '???';
if (name === 'yuvi') {
  document.getElementById('locked-state').style.display = 'none';
  document.getElementById('unlocked-state').style.display = 'flex';
  setupPuzzle({
    answer: 'alan',
    hint: 'You already decoded it to get here.',
    onSuccess: () => { window.location.href = 'level7.html'; }
  });
}
</script>
</body>
</html>
