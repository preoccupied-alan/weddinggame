<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Together — Alan & Lisa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#faf9f7; --bg2:#f3f1ee; --surface:#fff;
  --ink:#1a1916; --ink2:#4a4844; --ink3:#9a9793;
  --rule:#e2e0db; --rule2:#ccc9c3;
  --accent:#2d5a3d; --accent2:#1e3d2a; --accent3:#e8f0ea; --accent4:#c8dace;
  --serif:'DM Serif Display',serif; --sans:'DM Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body {
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-weight:300;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:56px 24px 80px;
  -webkit-font-smoothing:antialiased;
  text-align:center;
}

.names {
  font-family:var(--serif); font-size:clamp(40px,11vw,60px);
  color:var(--ink); font-style:italic; line-height:1.15;
  margin-bottom:4px;
  animation: up 0.8s ease both;
}
.amp {
  font-family:var(--serif); font-size:clamp(22px,6vw,32px);
  color:var(--ink3); font-style:italic;
  display:block; margin:2px 0;
}
.word {
  font-family:var(--serif); font-size:clamp(28px,8vw,44px);
  color:var(--accent); font-style:italic;
  margin:24px 0 8px;
  animation: up 1s ease 0.2s both;
}
.rule-line { width:48px; height:1px; background:var(--rule2); margin:20px auto; }

.card {
  background:var(--surface); border:1px solid var(--rule);
  border-radius:10px; padding:24px 22px;
  width:100%; max-width:400px; margin-bottom:16px;
  animation: up 1.1s ease 0.3s both;
}
.card-text {
  font-family:var(--sans); font-size:14px; font-weight:300;
  color:var(--ink2); line-height:1.8;
}

.log {
  width:100%; max-width:400px;
  background:var(--bg2); border:1px solid var(--rule);
  border-radius:8px; padding:20px 22px;
  text-align:left; margin-bottom:24px;
  animation: up 1.2s ease 0.4s both;
}
.log-row {
  display:flex; justify-content:space-between;
  font-family:var(--sans); font-size:12px;
  color:var(--ink3); line-height:2.4;
  border-bottom:1px solid var(--rule);
  padding:0 2px;
}
.log-row:last-child { border-bottom:none; }
.log-row span { color:var(--accent); font-weight:400; }

.btn {
  display:block; width:100%; max-width:400px;
  background:var(--accent); color:#fff;
  font-family:var(--sans); font-size:14px; font-weight:400;
  letter-spacing:0.04em; padding:15px;
  border:none; border-radius:8px; cursor:pointer;
  text-decoration:none; text-align:center;
  -webkit-tap-highlight-color:transparent;
  animation: up 1.3s ease 0.5s both;
}
.btn:active { background:var(--accent2); }

.fine {
  font-family:var(--sans); font-size:11px; font-weight:300;
  color:var(--ink3); margin-top:24px; line-height:2;
  letter-spacing:0.04em;
  animation: up 1.4s ease 0.6s both;
}

@keyframes up { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
</style>
</head>
<body>

<div class="names">Alan<span class="amp">&amp;</span>Lisa</div>
<div class="word">Together</div>
<div class="rule-line"></div>

<div class="card">
  <div class="card-text">
    Great job! Thanks for playing
  </div>
</div>



<a class="btn" href="index.html">Play again</a>

<div class="fine">
  Now go find them on the dance floor, take a selfie with your group, send it to them with "Congratulatios" for a prize.<br>
  Made with love for Alan &amp; Lisa's wedding.
</div>

</body>
</html>
